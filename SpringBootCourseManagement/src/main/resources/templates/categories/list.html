<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Loại khóa học')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container pb-5">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Loại khóa học</h2>
        <a class="btn btn-success" th:href="@{/categories/create}">+ Thêm loại khóa học</a>
    </div>

    <div th:if="${#lists.isEmpty(categories)}" class="alert alert-info">Chưa có loại khóa học nào.</div>

    <table th:unless="${#lists.isEmpty(categories)}" class="table table-bordered align-middle bg-white">
        <thead class="table-dark">
        <tr>
            <th>Tên loại</th>
            <th>Mô tả</th>
            <th class="text-end">Số khóa học</th>
            <th style="width: 160px;"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${categories}">
            <td th:text="${c.name}"></td>
            <td th:text="${c.description}"></td>
            <td class="text-end" th:text="${#lists.size(c.courses)}"></td>
            <td>
                <a class="btn btn-sm btn-outline-warning" th:href="@{/categories/{id}/edit(id=${c.id})}">Sửa</a>
                <form th:action="@{/categories/{id}/delete(id=${c.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Xóa loại khóa học này?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
