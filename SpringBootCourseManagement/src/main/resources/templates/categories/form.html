<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container pb-5">
    <h2 th:text="${title}">Loại khóa học</h2>

    <div class="card">
        <div class="card-body">
            <form th:action="@{${formAction}}" th:object="${form}" method="post" novalidate>

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="name">Tên loại khóa học</label>
                    <input type="text" th:field="*{name}" class="form-control" th:errorclass="is-invalid"/>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="description">Mô tả</label>
                    <textarea rows="3" th:field="*{description}" class="form-control" th:errorclass="is-invalid"></textarea>
                    <div class="invalid-feedback" th:errors="*{description}"></div>
                </div>

                <button type="submit" class="btn btn-success">Lưu</button>
                <a class="btn btn-outline-secondary" th:href="@{/categories}">Hủy</a>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
