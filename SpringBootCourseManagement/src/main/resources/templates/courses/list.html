<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Danh sách khóa học')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container pb-5">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Danh sách khóa học</h2>
        <a class="btn btn-success" th:href="@{/courses/create}">+ Thêm khóa học</a>
    </div>

    <!-- Form tìm kiếm / lọc / sắp xếp (GET). Giá trị đã nhập được giữ lại sau khi tìm kiếm. -->
    <form method="get" th:action="@{/courses}" class="card card-body mb-3">
        <div class="row g-2">
            <div class="col-md-4">
                <label class="form-label">Tìm theo tên khóa học</label>
                <input type="text" name="keyword" th:value="${filter.keyword}" class="form-control"
                       placeholder="Nhập một phần tên..."/>
            </div>
            <div class="col-md-4">
                <label class="form-label">Loại khóa học</label>
                <select name="categoryId" class="form-select">
                    <option value="">-- Tất cả --</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                            th:selected="${filter.categoryId != null and filter.categoryId == cat.id}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Trạng thái</label>
                <select name="status" class="form-select">
                    <option value="">-- Tất cả --</option>
                    <option value="active" th:selected="${filter.status == 'active'}">Đang tuyển sinh</option>
                    <option value="inactive" th:selected="${filter.status == 'inactive'}">Ngừng tuyển sinh</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Học phí tối thiểu</label>
                <input type="number" name="minFee" th:value="${filter.minFee}" min="0" step="any" class="form-control"/>
            </div>
            <div class="col-md-3">
                <label class="form-label">Học phí tối đa</label>
                <input type="number" name="maxFee" th:value="${filter.maxFee}" min="0" step="any" class="form-control"/>
            </div>
            <div class="col-md-3">
                <label class="form-label">Sắp xếp</label>
                <select name="sort" class="form-select">
                    <option value="">Mặc định</option>
                    <option value="fee_asc" th:selected="${filter.sort == 'fee_asc'}">Học phí tăng dần</option>
                    <option value="fee_desc" th:selected="${filter.sort == 'fee_desc'}">Học phí giảm dần</option>
                    <option value="duration_asc" th:selected="${filter.sort == 'duration_asc'}">Thời lượng tăng dần</option>
                </select>
            </div>
            <div class="col-md-3 d-flex align-items-end gap-2">
                <button type="submit" class="btn btn-primary">Tìm kiếm / Lọc</button>
                <a class="btn btn-outline-secondary" th:href="@{/courses}">Xóa lọc</a>
            </div>
        </div>
    </form>

    <div th:if="${errorMessage}" class="alert alert-warning" th:text="${errorMessage}"></div>

    <div th:if="${#lists.isEmpty(courses)}" class="alert alert-info">
        Không tìm thấy khóa học nào phù hợp với điều kiện tìm kiếm.
    </div>

    <div th:unless="${#lists.isEmpty(courses)}">
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle bg-white">
                <thead class="table-dark">
                <tr>
                    <th>Ảnh</th>
                    <th>Tên khóa học</th>
                    <th>Loại khóa học</th>
                    <th class="text-end">Học phí</th>
                    <th class="text-end">Thời lượng (giờ)</th>
                    <th>Phân loại</th>
                    <th>Trạng thái</th>
                    <th style="width: 190px;"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${courses}" th:classappend="${!c.active} ? 'table-secondary'">
                    <td>
                        <img th:if="${c.thumbnailImage != null}" class="thumb"
                             th:src="${c.thumbnailImage.imageUrl}" th:alt="${c.name}"
                             onerror="this.style.display='none'"/>
                        <span th:if="${c.thumbnailImage == null}" class="text-muted small">Chưa có ảnh</span>
                    </td>
                    <td th:text="${c.name}"></td>
                    <td th:text="${c.category.name}"></td>
                    <td class="text-end"
                        th:text="${#numbers.formatDecimal(c.tuitionFee, 1, 'POINT', 0, 'COMMA')} + ' ₫'"></td>
                    <td class="text-end" th:text="${c.duration}"></td>
                    <td>
                        <span class="badge" th:classappend="${c.duration <= 30} ? 'bg-info text-dark' : 'bg-primary'"
                              th:text="${c.durationType}"></span>
                    </td>
                    <td>
                        <span class="badge" th:classappend="${c.active} ? 'bg-success' : 'bg-secondary'"
                              th:text="${c.statusText}"></span>
                    </td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/courses/{id}(id=${c.id})}">Chi tiết</a>
                        <a class="btn btn-sm btn-outline-warning" th:href="@{/courses/{id}/edit(id=${c.id})}">Sửa</a>
                        <form th:action="@{/courses/{id}/delete(id=${c.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Xóa khóa học này?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="text-muted">Tìm thấy <span th:text="${#lists.size(courses)}"></span> khóa học.</p>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
