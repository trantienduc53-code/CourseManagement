spring.application.name=course-management
server.port=8080

# ---- SQL Server (sửa lại cho đúng máy của bạn, hoặc đặt biến môi trường DB_URL / DB_USERNAME / DB_PASSWORD) ----
# Cần tạo trước database rỗng:  CREATE DATABASE CourseManagementDb;
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=CourseManagementDb;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong@Passw0rd}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ---- JPA / Hibernate: tự tạo 3 bảng Courses, CourseCategories, CourseImages ----
spring.jpa.hibernate.ddl-auto=update
# Giữ nguyên tên cột đúng như khai báo (Id, Name, TuitionFee...) thay vì đổi sang snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# Không để lộ chi tiết lỗi hệ thống ra màn hình
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
