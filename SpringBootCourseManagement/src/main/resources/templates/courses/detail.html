<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Chi tiết khóa học')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container pb-5">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0" th:text="${course.name}"></h2>
        <div>
            <a class="btn btn-outline-warning" th:href="@{/courses/{id}/edit(id=${course.id})}">Sửa</a>
            <a class="btn btn-outline-secondary" th:href="@{/courses}">Quay lại</a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Loại khóa học</dt>
                <dd class="col-sm-9" th:text="${course.category.name}"></dd>

                <dt class="col-sm-3">Học phí</dt>
                <dd class="col-sm-9"
                    th:text="${#numbers.formatDecimal(course.tuitionFee, 1, 'POINT', 0, 'COMMA')} + ' ₫'"></dd>

                <dt class="col-sm-3">Thời lượng</dt>
                <dd class="col-sm-9">
                    <span th:text="${course.duration} + ' giờ'"></span>
                    <span class="badge" th:classappend="${course.duration <= 30} ? 'bg-info text-dark' : 'bg-primary'"
                          th:text="${course.durationType}"></span>
                </dd>

                <dt class="col-sm-3">Trạng thái</dt>
                <dd class="col-sm-9">
                    <span class="badge" th:classappend="${course.active} ? 'bg-success' : 'bg-secondary'"
                          th:text="${course.statusText}"></span>
                </dd>

                <dt class="col-sm-3">Mô tả</dt>
                <dd class="col-sm-9"
                    th:text="${course.description != null and !#strings.isEmpty(course.description)} ? ${course.description} : '(chưa có mô tả)'"></dd>
            </dl>
        </div>
    </div>

    <h4>Ảnh của khóa học (<span th:text="${#lists.size(course.images)}"></span>)</h4>

    <div th:if="${#lists.isEmpty(course.images)}" class="alert alert-info">Khóa học này chưa có ảnh nào.</div>

    <div th:unless="${#lists.isEmpty(course.images)}" class="row g-3 mb-4">
        <div th:each="img : ${course.images}" class="col-sm-6 col-md-4 col-lg-3">
            <div class="card h-100" th:classappend="${img.thumbnail} ? 'border-success border-2'">
                <img class="gallery-img card-img-top" th:src="${img.imageUrl}" th:alt="'Ảnh ' + ${img.id}"
                     onerror="this.alt='Không tải được ảnh'; this.style.background='#e9ecef';"/>
                <div class="card-body p-2">
                    <span th:if="${img.thumbnail}" class="badge bg-success mb-2">Ảnh đại diện</span>
                    <div class="d-flex gap-1">
                        <form th:unless="${img.thumbnail}"
                              th:action="@{/courses/images/{iid}/thumbnail(iid=${img.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-success">Đặt làm ảnh đại diện</button>
                        </form>
                        <form th:action="@{/courses/images/{iid}/delete(iid=${img.id})}" method="post"
                              onsubmit="return confirm('Xóa ảnh này?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Thêm ảnh bằng đường dẫn URL</div>
        <div class="card-body">
            <form th:action="@{/courses/{id}/images(id=${course.id})}" method="post"
                  class="row g-2 align-items-end">
                <div class="col-md-7">
                    <label class="form-label">Đường dẫn ảnh (URL)</label>
                    <input type="text" name="imageUrl" class="form-control" placeholder="https://..." required/>
                </div>
                <div class="col-md-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="thumbnail" value="true" id="thumbnail"/>
                        <label class="form-check-label" for="thumbnail">Đặt làm ảnh đại diện</label>
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Thêm ảnh</button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
